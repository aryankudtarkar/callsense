[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ser-prototype"
version = "0.1.0"
description = "Local Speech Emotion Recognition (SER) evaluation and navigation prototype"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "torch>=2.10.0",
    "transformers>=5.0.0",
    "numpy>=2.0.0",
    "funasr==1.4.16",
    "av==19.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
